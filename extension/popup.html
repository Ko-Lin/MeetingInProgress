<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Progress</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #202124;
      background: #f8f9fa;
    }

    .container {
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .settings-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    .main-action {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      padding: 12px 16px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      background: white;
      color: #1f73e8;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: #f8f9fa;
      border-color: #1f73e8;
    }

    button.primary {
      background: #1f73e8;
      color: white;
      border-color: #1f73e8;
      width: 100%;
      font-size: 14px;
      padding: 12px 16px;
    }

    button.primary:hover {
      background: #1765cc;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }

    .status-badge.active {
      background: #c6e9a8;
      color: #1b5e20;
    }

    .status-badge.inactive {
      background: #f3f3f3;
      color: #5f6368;
    }

    .info-section {
      background: white;
      border: 1px solid #dadce0;
      border-radius: 4px;
      padding: 12px;
      margin-top: 16px;
      font-size: 12px;
      color: #5f6368;
      line-height: 1.6;
    }

    .info-section strong {
      color: #202124;
      display: block;
      margin-bottom: 8px;
    }

    .info-section ul {
      margin-left: 16px;
    }

    .info-section li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Meeting Progress</h1>
      <button class="settings-btn" id="settingsBtn" title="Settings">⚙️</button>
    </div>

    <div class="main-action">
      <button class="primary" id="injectBtn">📍 Inject Overlay</button>
      <div class="status-badge inactive" id="statusBadge">Overlay: Not Injected</div>
    </div>

    <div class="info-section">
      <strong>💡 How to use:</strong>
      <ul>
        <li>• Click "Inject Overlay" to start</li>
        <li>• Click the drawer icon in overlay to edit agenda</li>
        <li>• Add items or paste from description</li>
        <li>• Click "Start Timer" in overlay</li>
        <li>• Use Prev/Next to navigate items</li>
      </ul>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
